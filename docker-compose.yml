# 日志封顶，避免默认 json-file 无限增长。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  blog:
    extends:
      file: ./compose.app.yml
      service: blog

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      blog:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 图片由 Caddy 直出；宿主机目录需先存在且属主 1001，否则 Docker 会以 root 创建。
      - ${BLOG_HOST_DATA_DIR:-../self_blog-data}/uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
