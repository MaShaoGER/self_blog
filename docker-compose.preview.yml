x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  blog:
    extends:
      file: ./compose.app.yml
      service: blog

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      blog:
        condition: service_healthy
    ports:
      - "127.0.0.1:9443:443"
    volumes:
      - ./deploy/Caddyfile.preview:/etc/caddy/Caddyfile:ro
      - ${BLOG_HOST_DATA_DIR:-../self_blog-data}/uploads:/srv/uploads:ro
      - preview_caddy_data:/data
      - preview_caddy_config:/config
    logging: *default-logging

volumes:
  preview_caddy_data:
  preview_caddy_config:
